<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Staff Management · VKV Nalbari</title>
<style>
html,body{margin:0;height:100%;background:#edf6f1;font-family:system-ui,Segoe UI,Arial;color:#263d4e}
.shell{height:100%;display:flex;flex-direction:column}
.archivebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 14px;background:#fff;border-bottom:1px solid #cadbe4;box-shadow:0 2px 8px #17324d12;z-index:5}
.archivebar strong{color:#17364f;margin-right:auto}.archivebar button{font:inherit;font-weight:750;border:1px solid #b8cdd8;border-radius:10px;padding:9px 12px;background:#e7f2f7;color:#17364f;cursor:pointer}.archivebar button.archive{background:#fff4dc;border-color:#d8bd77;color:#6b5114}.archivebar .note{width:100%;font-size:.78rem;color:#617685}
iframe{display:block;width:100%;flex:1;border:0;background:#edf6f1}
</style>
</head>
<body>
<div class="shell">
  <div class="archivebar">
    <strong>Staff Register Views</strong>
    <button id="showActive">Active Staff</button>
    <button id="showInactive" class="archive">Inactive / Archived</button>
    <div class="note">Deactivate keeps the staff record in the Staff Directory. Use “Inactive / Archived” to find it and “Activate Again” to restore it.</div>
  </div>
  <iframe id="staffApp" title="VKV Nalbari Staff Management" src="admin-staff-management-v6.html?v=66.3-staff-safety-fix"></iframe>
</div>
<script>
(function(){
 const frame=document.getElementById('staffApp');
 const activeBtn=document.getElementById('showActive');
 const inactiveBtn=document.getElementById('showInactive');
 function innerDoc(){try{return frame.contentDocument}catch(e){return null}}
 function clickFilter(name){const d=innerDoc();if(!d)return;const b=d.querySelector(`[data-filter="${name}"]`);if(b){b.style.setProperty('display','inline-block','important');b.style.setProperty('visibility','visible','important');b.click();d.getElementById('list')?.scrollIntoView({behavior:'smooth',block:'start'})}}
 activeBtn.onclick=()=>clickFilter('all');
 inactiveBtn.onclick=()=>clickFilter('inactive');
 function decorate(){
   const d=innerDoc();if(!d)return;
   const tabs=d.querySelector('.tabs');
   if(tabs){tabs.style.setProperty('display','flex','important');tabs.style.setProperty('visibility','visible','important');tabs.style.setProperty('opacity','1','important');tabs.style.setProperty('min-height','44px','important')}
   const inTab=d.querySelector('[data-filter="inactive"]');
   if(inTab){inTab.textContent='Inactive / Archived';inTab.style.setProperty('display','inline-block','important');inTab.style.setProperty('visibility','visible','important')}
   const service=d.getElementById('serviceStatus');
   if(service){[...service.options].forEach(o=>{if((o.value||o.textContent).trim()==='Local Appointment')o.textContent='LA'})}
   const rows=d.querySelectorAll('#list tbody tr');
   rows.forEach(row=>{
     const cells=row.querySelectorAll('td');
     if(cells[8]&&cells[8].textContent.trim()==='Local Appointment')cells[8].textContent='LA';
     const status=cells[13]?.textContent.trim();
     const actions=cells[14];
     if(status==='Inactive'&&actions&&!actions.querySelector('[data-v7-reactivate]')){
       const edit=actions.querySelector('[data-edit]');
       if(edit){
         const b=d.createElement('button');b.type='button';b.textContent='Activate Again';b.setAttribute('data-v7-reactivate','1');b.style.marginLeft='4px';
         b.onclick=()=>{edit.click();const a=d.getElementById('active'),save=d.getElementById('save');if(a&&save){a.value='true';setTimeout(()=>save.click(),50)}};
         actions.insertBefore(b,actions.querySelector('[data-delete]')||null);
       }
     }
   });
 }
 frame.addEventListener('load',()=>{
   const d=innerDoc();if(!d)return;
   decorate();
   const obs=new MutationObserver(decorate);obs.observe(d.body,{childList:true,subtree:true,characterData:true});
 });
})();
</script>
</body>
</html>
