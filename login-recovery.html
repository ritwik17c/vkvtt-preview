<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>VKVTT Login Recovery</title><style>body{font-family:system-ui,Segoe UI,Arial;background:#edf6f1;color:#17364f;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;border:1px solid #cbdce5;border-radius:18px;padding:24px;max-width:560px;box-shadow:0 6px 24px #17324d14}.muted{color:#617685}</style></head><body><div class="card"><h2>Restoring VKVTT preview access…</h2><div id="msg" class="muted">Clearing stale preview cache and reopening the login page.</div></div><script>(async()=>{const msg=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>String(r.scope||'').includes('/vkvtt-preview/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/vkvtt/i.test(k)).map(k=>caches.delete(k)))}try{sessionStorage.removeItem('vkvttPreviewCacheResetV663RoleIdentity2');sessionStorage.removeItem('vkvttPreviewCacheResetV662Final1')}catch(_){}msg.textContent='Cache cleared. Reopening VKVTT preview…';setTimeout(()=>location.replace('./?recovery=login-safe-1&t='+Date.now()),500)}catch(e){msg.textContent='Recovery completed with a browser warning. Reopening…';setTimeout(()=>location.replace('./?recovery=login-safe-1&t='+Date.now()),700)}})();</script></body></html>
